# Keeps dependencies current across the Go module, the frontend, and the
# workflows. Updates are grouped so each ecosystem opens one PR a week rather
# than a swarm of them.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (the native port) is ahead of the Svelte toolchain:
      # svelte-check only accepts typescript ^5 || ^6, so a major bump breaks
      # `npm ci` with an ERESOLVE peer conflict. Hold at 5.x until svelte-check
      # supports 7, then lift this.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
